<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Glow Ball</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#fff;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

#menu{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(255,255,255,.97);
    z-index:10;
}

.logo{
    font-size:42px;
    font-weight:bold;
    letter-spacing:4px;
    color:#168cff;
    text-shadow:
        0 0 8px rgba(22,140,255,.5),
        0 0 20px rgba(255,70,160,.3);
}

.subtitle{
    color:#777;
    margin-top:5px;
    margin-bottom:5px;
    font-size:15px;
}

.version{
    color:#aaa;
    font-size:11px;
    margin-bottom:20px;
}

.levelText{
    font-size:20px;
    font-weight:bold;
    color:#333;
    margin:10px 0;
}

.levelControls{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:18px;
}

.smallBtn{
    width:55px;
    height:55px;
    border:none;
    border-radius:15px;
    background:#f2f2f2;
    font-size:28px;
    font-weight:bold;
    color:#333;
    box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.smallBtn:active,
.modeBtn:active,
#startBtn:active,
.resultBtn:active,
#pauseBtn:active{
    transform:scale(.94);
}

#levelNumber{
    width:45px;
    text-align:center;
    font-size:25px;
    font-weight:bold;
}

.modeButtons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
}

.modeBtn{
    border:none;
    border-radius:14px;
    padding:13px 20px;
    background:#eee;
    color:#333;
    font-weight:bold;
    font-size:14px;
}

.modeBtn.active{
    color:white;
    background:linear-gradient(135deg,#168cff,#ff4fa3);
    box-shadow:0 5px 18px rgba(22,140,255,.3);
}

#startBtn{
    margin-top:20px;
    padding:16px 50px;
    border:none;
    border-radius:18px;
    color:white;
    font-size:18px;
    font-weight:bold;
    background:linear-gradient(135deg,#168cff,#ff4fa3);
    box-shadow:0 7px 25px rgba(22,140,255,.35);
}

#bestMenu{
    margin-top:14px;
    font-size:14px;
    color:#777;
}

#bestMenu span{
    color:#8d4dff;
    font-weight:bold;
}

#scores{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:35px;
    z-index:4;
    font-size:22px;
    font-weight:bold;
}

.you{
    color:#168cff;
}

.ai{
    color:#ff4fa3;
}

#bestGame{
    position:absolute;
    top:52px;
    left:50%;
    transform:translateX(-50%);
    z-index:4;
    font-size:12px;
    color:#999;
}

#pauseBtn{
    position:absolute;
    top:16px;
    right:16px;
    z-index:5;
    border:none;
    background:rgba(245,245,245,.92);
    border-radius:12px;
    padding:10px 14px;
    font-size:18px;
}

#message{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:#333;
    display:none;
    z-index:6;
}

#message small{
    display:block;
    margin-top:10px;
    font-size:14px;
    color:#888;
}

#result{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:rgba(255,255,255,.95);
    z-index:9;
}

#resultTitle{
    font-size:40px;
    font-weight:bold;
    margin-bottom:15px;
}

.resultWin{
    color:#168cff;
}

.resultLose{
    color:#ff4fa3;
}

#resultScore{
    font-size:22px;
    font-weight:bold;
    color:#333;
    margin-bottom:8px;
}

#resultBest{
    color:#777;
    font-size:15px;
    margin-bottom:22px;
}

.resultBtn{
    border:none;
    border-radius:15px;
    padding:14px 30px;
    margin:5px;
    font-weight:bold;
    font-size:15px;
}

#againBtn{
    color:white;
    background:linear-gradient(135deg,#168cff,#ff4fa3);
}

#menuBtn{
    background:#eee;
    color:#333;
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="scores">
    <span class="ai">
        AI: <span id="aiScore">0</span>
    </span>

    <span class="you">
        YOU: <span id="playerScore">0</span>
    </span>
</div>

<div id="bestGame">
    BEST: <span id="bestGameValue">0</span>
</div>

<button id="pauseBtn">Ⅱ</button>

<div id="message">
    PAUSED
    <small>Tap pause to continue</small>
</div>

<div id="menu">

    <div class="logo">GLOW BALL</div>

    <div class="subtitle">
        AI BATTLE
    </div>

    <div class="version">
        VERSION 1.1
    </div>

    <div class="levelText">
        AI LEVEL
    </div>

    <div class="levelControls">

        <button
            class="smallBtn"
            id="minus">
            −
        </button>

        <div id="levelNumber">
            5
        </div>

        <button
            class="smallBtn"
            id="plus">
            +
        </button>

    </div>

    <div class="modeButtons">

        <button
            class="modeBtn"
            data-mode="easy">
            EASY
        </button>

        <button
            class="modeBtn active"
            data-mode="normal">
            NORMAL
        </button>

        <button
            class="modeBtn"
            data-mode="hard">
            HARD
        </button>

    </div>

    <button id="startBtn">
        START GAME
    </button>

    <div id="bestMenu">
        BEST SCORE:
        <span id="bestMenuValue">0</span>
    </div>

</div>

<div id="result">

    <div id="resultTitle">
        YOU WIN!
    </div>

    <div id="resultScore">
        YOU 0 : 0 AI
    </div>

    <div id="resultBest">
        BEST SCORE: 0
    </div>

    <div>

        <button
            class="resultBtn"
            id="againBtn">
            PLAY AGAIN
        </button>

        <button
            class="resultBtn"
            id="menuBtn">
            MENU
        </button>

    </div>

</div>

</div>

<script>

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

let W = 0;
let H = 0;


/* =========================
   RESIZE
========================= */

function resize(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;

    canvas.width =
        W * dpr;

    canvas.height =
        H * dpr;

    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    updateSizes();
}

window.addEventListener(
    "resize",
    resize
);


/* =========================
   PLAYER
========================= */

const player = {

    x:0,
    y:0,

    w:110,
    h:14
};


/* =========================
   AI
========================= */

const ai = {

    x:0,
    y:0,

    w:110,
    h:14
};


/* =========================
   BALL
========================= */

const ball = {

    x:0,
    y:0,

    r:10,

    vx:0,
    vy:0,

    speed:6
};


/* =========================
   GAME STATE
========================= */

let playerScore = 0;
let aiScore = 0;

let level = 5;
let mode = "normal";

let running = false;
let paused = false;

const WIN_SCORE = 7;

let particles = [];
let trail = [];

let shake = 0;
let flash = 0;


/* =========================
   AUDIO
========================= */

let audioContext = null;

function initAudio(){

    if(!audioContext){

        try{

            audioContext =
                new(
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }catch(e){

            audioContext = null;
        }
    }

    if(
        audioContext &&
        audioContext.state === "suspended"
    ){

        audioContext.resume();
    }
}

function playSound(
    frequency,
    duration,
    type="sine",
    volume=.05
){

    if(!audioContext)
        return;

    try{

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type =
            type;

        oscillator.frequency.setValueAtTime(
            frequency,
            audioContext.currentTime
        );

        gain.gain.setValueAtTime(
            volume,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioContext.currentTime +
            duration
        );

        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            duration
        );

    }catch(e){}
}

function paddleSound(){

    playSound(
        420,
        .07,
        "square",
        .035
    );
}

function wallSound(){

    playSound(
        260,
        .05,
        "sine",
        .025
    );
}

function scoreSound(){

    playSound(
        700,
        .08,
        "sine",
        .05
    );

    setTimeout(
        ()=>{
            playSound(
                950,
                .12,
                "sine",
                .04
            );
        },
        70
    );
}

function loseSound(){

    playSound(
        220,
        .18,
        "sawtooth",
        .04
    );
}


/* =========================
   BEST SCORE
========================= */

let bestScore = 0;

try{

    bestScore =
        Number(
            localStorage.getItem(
                "glowBallBestScore"
            )
        ) || 0;

}catch(e){

    bestScore = 0;
}

const bestMenuValue =
    document.getElementById(
        "bestMenuValue"
    );

const bestGameValue =
    document.getElementById(
        "bestGameValue"
    );

bestMenuValue.textContent =
    bestScore;

bestGameValue.textContent =
    bestScore;


/* =========================
   ELEMENTS
========================= */

const aiScoreEl =
    document.getElementById(
        "aiScore"
    );

const playerScoreEl =
    document.getElementById(
        "playerScore"
    );

const levelNumber =
    document.getElementById(
        "levelNumber"
    );

const menu =
    document.getElementById(
        "menu"
    );

const message =
    document.getElementById(
        "message"
    );

const result =
    document.getElementById(
        "result"
    );

const resultTitle =
    document.getElementById(
        "resultTitle"
    );

const resultScore =
    document.getElementById(
        "resultScore"
    );

const resultBest =
    document.getElementById(
        "resultBest"
    );


/* =========================
   SIZES
========================= */

function updateSizes(){

    player.w =
        Math.max(
            80,
            Math.min(
                140,
                W * .27
            )
        );

    player.h = 14;

    ai.w =
        player.w;

    ai.h = 14;

    player.x =
        W / 2 -
        player.w / 2;

    player.y =
        H -
        Math.max(
            45,
            H * .08
        );

    ai.x =
        W / 2 -
        ai.w / 2;

    ai.y =
        Math.max(
            55,
            H * .08
        );

    if(!running){

        player.x =
            W / 2 -
            player.w / 2;

        ai.x =
            W / 2 -
            ai.w / 2;
    }
}


/* =========================
   BALL RESET
========================= */

function resetBall(
    direction=1
){

    ball.x =
        W / 2;

    ball.y =
        H / 2;

    ball.speed =
        Math.max(
            5,
            Math.min(
                11,
                5 +
                level *
                .35
            )
        );

    const angle =
        Math.random() *
        .9 -
        .45;

    ball.vx =
        Math.sin(angle) *
        ball.speed;

    ball.vy =
        Math.cos(angle) *
        ball.speed *
        direction;

    trail = [];
}


/* =========================
   RESET GAME
========================= */

function resetGame(){

    playerScore = 0;
    aiScore = 0;

    particles = [];
    trail = [];

    shake = 0;
    flash = 0;

    aiScoreEl.textContent =
        "0";

    playerScoreEl.textContent =
        "0";

    updateSizes();

    resetBall(
        Math.random() > .5
        ? 1
        : -1
    );
}


/* =========================
   LEVEL
========================= */

function setLevel(value){

    level =
        Math.max(
            1,
            Math.min(
                10,
                value
            )
        );

    levelNumber.textContent =
        level;
}

document
.getElementById("minus")
.addEventListener(
    "click",
    ()=>{
        setLevel(
            level - 1
        );
    }
);

document
.getElementById("plus")
.addEventListener(
    "click",
    ()=>{
        setLevel(
            level + 1
        );
    }
);


/* =========================
   MODES
========================= */

document
.querySelectorAll(".modeBtn")
.forEach(btn=>{

    btn.addEventListener(
        "click",
        ()=>{

            document
            .querySelectorAll(
                ".modeBtn"
            )
            .forEach(b=>{
                b.classList.remove(
                    "active"
                );
            });

            btn.classList.add(
                "active"
            );

            mode =
                btn.dataset.mode;

            if(mode === "easy"){

                setLevel(
                    Math.min(
                        level,
                        3
                    )
                );
            }

            if(mode === "normal"){

                setLevel(
                    Math.max(
                        4,
                        Math.min(
                            level,
                            7
                        )
                    )
                );
            }

            if(mode === "hard"){

                setLevel(
                    Math.max(
                        8,
                        level
                    )
                );
            }
        }
    );
});


/* =========================
   START
========================= */

document
.getElementById("startBtn")
.addEventListener(
    "click",
    ()=>{

        initAudio();

        menu.style.display =
            "none";

        result.style.display =
            "none";

        running = true;
        paused = false;

        message.style.display =
            "none";

        resetGame();
    }
);


/* =========================
   PAUSE
========================= */

document
.getElementById("pauseBtn")
.addEventListener(
    "click",
    ()=>{

        if(!running)
            return;

        paused =
            !paused;

        message.style.display =
            paused
            ? "block"
            : "none";

        if(!paused)
            initAudio();
    }
);


/* =========================
   PLAYER TOUCH
========================= */

function movePlayer(x){

    player.x =
        x -
        player.w / 2;

    if(
        player.x < 0
    ){

        player.x = 0;
    }

    if(
        player.x +
        player.w >
        W
    ){

        player.x =
            W -
            player.w;
    }
}

canvas.addEventListener(
    "touchstart",
    e=>{

        if(
            !running ||
            paused
        )
            return;

        e.preventDefault();

        initAudio();

        movePlayer(
            e.touches[0].clientX
        );

    },
    {passive:false}
);

canvas.addEventListener(
    "touchmove",
    e=>{

        if(
            !running ||
            paused
        )
            return;

        e.preventDefault();

        movePlayer(
            e.touches[0].clientX
        );

    },
    {passive:false}
);

canvas.addEventListener(
    "mousemove",
    e=>{

        if(
            !running ||
            paused
        )
            return;

        movePlayer(
            e.clientX
        );
    }
);


/* =========================
   AI
========================= */

function updateAI(){

    let aiSpeed;

    if(
        mode === "easy"
    ){

        aiSpeed =
            3.5 +
            level *
            .18;

    }
    else if(
        mode === "hard"
    ){

        aiSpeed =
            6 +
            level *
            .35;

    }
    else{

        aiSpeed =
            4.5 +
            level *
            .25;
    }

    const target =
        ball.x -
        ai.w / 2;

    if(
        ai.x <
        target
    ){

        ai.x +=
            aiSpeed;

    }
    else{

        ai.x -=
            aiSpeed;
    }

    if(
        ai.x < 0
    )
        ai.x = 0;

    if(
        ai.x +
        ai.w >
        W
    ){

        ai.x =
            W -
            ai.w;
    }
}


/* =========================
   COLLISION
========================= */

function collision(
    paddle
){

    return(
        ball.x +
        ball.r >
        paddle.x &&

        ball.x -
        ball.r <
        paddle.x +
        paddle.w &&

        ball.y +
        ball.r >
        paddle.y &&

        ball.y -
        ball.r <
        paddle.y +
        paddle.h
    );
}


/* =========================
   PARTICLES
========================= */

function createParticles(
    x,
    y,
    color,
    amount=16
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        const angle =
            Math.random() *
            Math.PI *
            2;

        const speed =
            1 +
            Math.random() *
            5;

        particles.push({

            x:x,
            y:y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life:1,

            size:
                2 +
                Math.random() *
                4,

            color:color
        });
    }
}

function updateParticles(){

    for(
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ){

        const p =
            particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= .97;
        p.vy *= .97;

        p.life -= .035;

        if(
            p.life <= 0
        ){

            particles.splice(
                i,
                1
            );
        }
    }
}

function drawParticles(){

    for(
        const p of particles
    ){

        ctx.save();

        ctx.globalAlpha =
            Math.max(
                0,
                p.life
            );

        ctx.shadowBlur = 15;

        ctx.shadowColor =
            p.color;

        ctx.fillStyle =
            p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}


/* =========================
   PADDLE HIT
========================= */

function hitPaddle(
    paddle,
    direction
){

    const relative =
        (
            ball.x -
            (
                paddle.x +
                paddle.w / 2
            )
        ) /
        (
            paddle.w / 2
        );

    const angle =
        relative *
        1.05;

    const speed =
        Math.min(
            Math.sqrt(
                ball.vx *
                ball.vx +
                ball.vy *
                ball.vy
            ) +
            .25,
            13
        );

    ball.vy =
        Math.cos(angle) *
        speed *
        direction;

    ball.vx =
        Math.sin(angle) *
        speed;

    if(
        direction < 0
    ){

        ball.y =
            paddle.y +
            paddle.h +
            ball.r;

        createParticles(
            ball.x,
            ball.y,
            "#ff4fa3",
            13
        );

    }
    else{

        ball.y =
            paddle.y -
            ball.r;

        createParticles(
            ball.x,
            ball.y,
            "#168cff",
            13
        );
    }

    shake = 4;

    paddleSound();
}


/* =========================
   BEST SCORE
========================= */

function saveBestScore(){

    if(
        playerScore >
        bestScore
    ){

        bestScore =
            playerScore;

        try{

            localStorage.setItem(
                "glowBallBestScore",
                bestScore
            );

        }catch(e){}

        bestMenuValue.textContent =
            bestScore;

        bestGameValue.textContent =
            bestScore;
    }
}


/* =========================
   SCORE
========================= */

function scorePoint(
    who
){

    if(
        who === "player"
    ){

        playerScore++;

        playerScoreEl.textContent =
            playerScore;

        saveBestScore();

        createParticles(
            W / 2,
            H / 2,
            "#168cff",
            35
        );

        flash = 1;
        shake = 10;

        scoreSound();

        if(
            playerScore >=
            WIN_SCORE
        ){

            endGame(true);

            return;
        }

        resetBall(-1);

    }
    else{

        aiScore++;

        aiScoreEl.textContent =
            aiScore;

        createParticles(
            W / 2,
            H / 2,
            "#ff4fa3",
            35
        );

        flash = 1;
        shake = 10;

        loseSound();

        if(
            aiScore >=
            WIN_SCORE
        ){

            endGame(false);

            return;
        }

        resetBall(1);
    }
}


/* =========================
   END GAME
========================= */

function endGame(
    playerWon
){

    running = false;
    paused = false;

    message.style.display =
        "none";

    result.style.display =
        "flex";

    if(
        playerWon
    ){

        resultTitle.textContent =
            "YOU WIN!";

        resultTitle.className =
            "resultWin";

    }
    else{

        resultTitle.textContent =
            "AI WINS!";

        resultTitle.className =
            "resultLose";
    }

    resultScore.textContent =
        "YOU " +
        playerScore +
        " : " +
        aiScore +
        " AI";

    resultBest.textContent =
        "BEST SCORE: " +
        bestScore;
}


/* =========================
   RESULT BUTTONS
========================= */

document
.getElementById("againBtn")
.addEventListener(
    "click",
    ()=>{

        initAudio();

        result.style.display =
            "none";

        running = true;
        paused = false;

        resetGame();
    }
);

document
.getElementById("menuBtn")
.addEventListener(
    "click",
    ()=>{

        result.style.display =
            "none";

        menu.style.display =
            "flex";

        running = false;
        paused = false;

        updateSizes();

        resetBall(1);
    }
);


/* =========================
   UPDATE
========================= */

function update(){

    updateParticles();

    if(
        shake > 0
    )
        shake *= .88;

    if(
        flash > 0
    )
        flash *= .88;

    if(
        !running ||
        paused
    )
        return;

    updateAI();

    ball.x += ball.vx;
    ball.y += ball.vy;

    trail.push({
        x:ball.x,
        y:ball.y
    });

    if(
        trail.length > 14
    )
        trail.shift();


    /* TOP WALL */

    if(
        ball.y -
        ball.r <= 0
    ){

        ball.y =
            ball.r;

        ball.vy =
            Math.abs(
                ball.vy
            );

        createParticles(
            ball.x,
            ball.y,
            "#8d4dff",
            8
        );

        wallSound();
    }


    /* BOTTOM WALL */

    if(
        ball.y +
        ball.r >= H
    ){

        ball.y =
            H -
            ball.r;

        ball.vy =
            -Math.abs(
                ball.vy
            );

        createParticles(
            ball.x,
            ball.y,
            "#8d4dff",
            8
        );

        wallSound();
    }


    /* AI */

    if(
        ball.vy < 0 &&
        collision(ai)
    ){

        hitPaddle(
            ai,
            1
        );
    }


    /* PLAYER */

    if(
        ball.vy > 0 &&
        collision(player)
    ){

        hitPaddle(
            player,
            -1
        );
    }


    /*
       In this version,
       the ball cannot score
       through the top/bottom
       immediately because the
       paddles sit inside them.
       The scoring zones are
       calculated around paddles.
    */

    if(
        ball.y >
        H + 30
    ){

        scorePoint("ai");
    }

    if(
        ball.y <
        -30
    ){

        scorePoint("player");
    }
}


/* =========================
   BALL
========================= */

function drawGlowCircle(
    x,
    y,
    radius,
    color
){

    ctx.save();

    ctx.shadowBlur = 28;

    ctx.shadowColor =
        color;

    ctx.fillStyle =
        color;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
}


/* =========================
   TRAIL
========================= */

function drawTrail(){

    for(
        let i=0;
        i<trail.length;
        i++
    ){

        const p =
            trail[i];

        const alpha =
            i /
            trail.length *
            .25;

        const radius =
            ball.r *
            (
                .25 +
                i /
                trail.length *
                .5
            );

        ctx.save();

        ctx.globalAlpha =
            alpha;

        ctx.fillStyle =
            "#8d4dff";

        ctx.shadowBlur =
            15;

        ctx.shadowColor =
            "#8d4dff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}


/* =========================
   PADDLES
========================= */

function drawPaddle(
    paddle,
    color
){

    ctx.save();

    ctx.shadowBlur = 30;

    ctx.shadowColor =
        color;

    ctx.fillStyle =
        color;

    ctx.beginPath();

    ctx.roundRect(
        paddle.x,
        paddle.y,
        paddle.w,
        paddle.h,
        8
    );

    ctx.fill();

    ctx.restore();

    ctx.save();

    ctx.globalAlpha =
        .35;

    ctx.fillStyle =
        "#fff";

    ctx.beginPath();

    ctx.roundRect(
        paddle.x + 8,
        paddle.y + 3,
        paddle.w - 16,
        3,
        3
    );

    ctx.fill();

    ctx.restore();
}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.save();

    let offsetX = 0;
    let offsetY = 0;

    if(
        shake > 0
    ){

        offsetX =
            (
                Math.random() -
                .5
            ) *
            shake;

        offsetY =
            (
                Math.random() -
                .5
            ) *
            shake;
    }

    ctx.translate(
        offsetX,
        offsetY
    );

    ctx.clearRect(
        -20,
        -20,
        W + 40,
        H + 40
    );

    ctx.fillStyle =
        "#fff";

    ctx.fillRect(
        -20,
        -20,
        W + 40,
        H + 40
    );


    /* CENTER LINE */

    ctx.save();

    ctx.setLineDash([
        10,
        12
    ]);

    ctx.strokeStyle =
        "#e5e5e5";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(
        0,
        H / 2
    );

    ctx.lineTo(
        W,
        H / 2
    );

    ctx.stroke();

    ctx.restore();


    drawTrail();

    drawPaddle(
        ai,
        "#ff4fa3"
    );

    drawPaddle(
        player,
        "#168cff"
    );

    drawGlowCircle(
        ball.x,
        ball.y,
        ball.r,
        "#8d4dff"
    );


    /* BALL AURA */

    ctx.save();

    ctx.globalAlpha =
        .18;

    ctx.fillStyle =
        "#8d4dff";

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.r * 2.5,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();


    drawParticles();


    /* FLASH */

    if(
        flash > .01
    ){

        ctx.save();

        ctx.globalAlpha =
            flash * .16;

        ctx.fillStyle =
            "#8d4dff";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        ctx.restore();
    }

    ctx.restore();
}


/* =========================
   LOOP
========================= */

function loop(){

    update();

    draw();

    requestAnimationFrame(
        loop
    );
}


/* =========================
   START
========================= */

resize();

updateSizes();

resetBall(1);

loop();

</script>
