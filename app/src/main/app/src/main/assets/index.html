<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Glow Ball</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
    font-family: Arial, sans-serif;
}

body {
    touch-action: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#menu {
    position: absolute;
    inset: 0;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

#menu h1 {
    margin: 0 0 8px;
    font-size: 46px;
    color: #6c35ff;
}

#menu p {
    margin: 0 0 25px;
    color: #666;
    font-size: 15px;
}

.label {
    margin-top: 8px;
    margin-bottom: 8px;
    color: #444;
    font-size: 14px;
}

.levels {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 310px;
}

.level {
    border: 0;
    border-radius: 10px;
    padding: 9px 12px;
    background: #eeeeee;
    color: #333;
    font-weight: bold;
}

.level.selected {
    background: #6c35ff;
    color: white;
}

.mode {
    width: 220px;
    margin: 5px;
    padding: 13px;
    border: 0;
    border-radius: 12px;
    background: #eeeeee;
    color: #333;
    font-size: 16px;
    font-weight: bold;
}

.mode.selected {
    background: #ff3d81;
    color: white;
}

#start {
    margin-top: 25px;
    width: 220px;
    padding: 15px;
    border: 0;
    border-radius: 14px;
    background: #6c35ff;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

#hud {
    position: absolute;
    top: 10px;
    left: 0;
    right: 0;
    display: none;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    z-index: 5;
    pointer-events: none;
}

.scoreBox {
    min-width: 100px;
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    color: #333;
}

#pause {
    pointer-events: auto;
    border: 0;
    border-radius: 10px;
    padding: 9px 13px;
    background: #eeeeee;
    font-weight: bold;
}

#best {
    font-size: 12px;
    color: #777;
    text-align: center;
}

#result {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(255,255,255,0.96);
    z-index: 20;
}

#result h2 {
    margin: 0 0 10px;
    color: #6c35ff;
    font-size: 38px;
}

#result p {
    color: #555;
}

#again,
#backMenu {
    width: 210px;
    margin: 6px;
    padding: 13px;
    border: 0;
    border-radius: 12px;
    font-weight: bold;
}

#again {
    background: #6c35ff;
    color: white;
}

#backMenu {
    background: #eeeeee;
    color: #333;
}

#message {
    position: absolute;
    top: 75px;
    left: 0;
    right: 0;
    text-align: center;
    color: #777;
    font-size: 13px;
    pointer-events: none;
    z-index: 4;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

    <h1>Glow Ball</h1>
    <p>Vertical Edition</p>

    <div class="label">AI LEVEL</div>

    <div class="levels">
        <button class="level selected" data-level="1">1</button>
        <button class="level" data-level="2">2</button>
        <button class="level" data-level="3">3</button>
        <button class="level" data-level="4">4</button>
        <button class="level" data-level="5">5</button>
        <button class="level" data-level="6">6</button>
        <button class="level" data-level="7">7</button>
        <button class="level" data-level="8">8</button>
        <button class="level" data-level="9">9</button>
        <button class="level" data-level="10">10</button>
    </div>

    <div class="label">MODE</div>

    <button class="mode selected" data-mode="normal">NORMAL</button>
    <button class="mode" data-mode="easy">EASY</button>
    <button class="mode" data-mode="hard">HARD</button>

    <button id="start">START GAME</button>

</div>

<div id="hud">

    <div class="scoreBox">
        <div id="playerScore">0</div>
        <div style="font-size:11px;color:#1687ff;">YOU</div>
    </div>

    <div>
        <div id="best">BEST: 0</div>
        <button id="pause">PAUSE</button>
    </div>

    <div class="scoreBox">
        <div id="aiScore">0</div>
        <div style="font-size:11px;color:#ff3d81;">AI</div>
    </div>

</div>

<div id="message">
    Drag left and right to move your paddle
</div>

<div id="result">

    <h2 id="winner">YOU WIN!</h2>

    <p id="finalScore">0 : 0</p>

    <button id="again">PLAY AGAIN</button>
    <button id="backMenu">MENU</button>

</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const menu = document.getElementById("menu");
const hud = document.getElementById("hud");
const result = document.getElementById("result");

const playerScoreText =
    document.getElementById("playerScore");

const aiScoreText =
    document.getElementById("aiScore");

const bestText =
    document.getElementById("best");

const pauseButton =
    document.getElementById("pause");

const winnerText =
    document.getElementById("winner");

const finalScoreText =
    document.getElementById("finalScore");

const againButton =
    document.getElementById("again");

const backMenuButton =
    document.getElementById("backMenu");

let W = 0;
let H = 0;

let running = false;
let paused = false;

let level = 1;
let mode = "normal";

let playerScore = 0;
let aiScore = 0;

let bestScore = 0;

try {
    bestScore =
        Number(localStorage.getItem("glowBallBest") || 0);
} catch(e) {
    bestScore = 0;
}

bestText.textContent = "BEST: " + bestScore;


/* =========================
   OBJECTS
========================= */

const player = {
    x: 0,
    y: 0,
    w: 110,
    h: 15
};

const ai = {
    x: 0,
    y: 0,
    w: 110,
    h: 15
};

const ball = {
    x: 0,
    y: 0,
    r: 10,
    vx: 0,
    vy: 0
};

let particles = [];
let trail = [];


/* =========================
   RESIZE
========================= */

function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    const ratio =
        Math.max(1, Math.min(2, window.devicePixelRatio || 1));

    canvas.width = Math.floor(W * ratio);
    canvas.height = Math.floor(H * ratio);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

    player.w = Math.min(130, W * 0.32);
    player.h = Math.max(13, H * 0.018);

    ai.w = player.w;
    ai.h = player.h;

    player.x = W / 2 - player.w / 2;
    player.y = H - Math.max(70, H * 0.10);

    ai.x = W / 2 - ai.w / 2;
    ai.y = Math.max(70, H * 0.10);

    if (!running) {
        resetBall();
    }
}

window.addEventListener("resize", resize);


/* =========================
   RESET BALL
========================= */

function resetBall(direction) {

    ball.x = W / 2;
    ball.y = H / 2;

    const speed =
        4.5 + level * 0.35;

    const randomX =
        (Math.random() - 0.5) * 3;

    ball.vx = randomX;

    if (direction === "up") {
        ball.vy = -speed;
    } else if (direction === "down") {
        ball.vy = speed;
    } else {
        ball.vy =
            Math.random() > 0.5 ? speed : -speed;
    }

    trail = [];
}


/* =========================
   START
========================= */

function startGame() {

    playerScore = 0;
    aiScore = 0;

    playerScoreText.textContent = "0";
    aiScoreText.textContent = "0";

    player.x = W / 2 - player.w / 2;
    ai.x = W / 2 - ai.w / 2;

    resetBall();

    particles = [];
    trail = [];

    running = true;
    paused = false;

    menu.style.display = "none";
    result.style.display = "none";
    hud.style.display = "flex";

    pauseButton.textContent = "PAUSE";
}


/* =========================
   LEVEL
========================= */

document.querySelectorAll(".level").forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".level")
            .forEach(b => b.classList.remove("selected"));

        button.classList.add("selected");

        level =
            Number(button.dataset.level);
    });

});


/* =========================
   MODE
========================= */

document.querySelectorAll(".mode").forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".mode")
            .forEach(b => b.classList.remove("selected"));

        button.classList.add("selected");

        mode = button.dataset.mode;
    });

});


/* =========================
   PAUSE
========================= */

pauseButton.addEventListener("click", () => {

    if (!running) return;

    paused = !paused;

    pauseButton.textContent =
        paused ? "RESUME" : "PAUSE";
});


/* =========================
   TOUCH CONTROL
========================= */

function movePlayer(clientX) {

    player.x =
        clientX - player.w / 2;

    if (player.x < 10)
        player.x = 10;

    if (player.x + player.w > W - 10)
        player.x = W - player.w - 10;
}

canvas.addEventListener("touchstart", e => {

    if (!running || paused) return;

    if (e.touches.length > 0) {
        movePlayer(e.touches[0].clientX);
    }

    e.preventDefault();

}, {passive:false});


canvas.addEventListener("touchmove", e => {

    if (!running || paused) return;

    if (e.touches.length > 0) {
        movePlayer(e.touches[0].clientX);
    }

    e.preventDefault();

}, {passive:false});


canvas.addEventListener("mousemove", e => {

    if (!running || paused) return;

    movePlayer(e.clientX);
});


/* =========================
   COLLISION
========================= */

function paddleCollision(paddle, isPlayer) {

    return (
        ball.x + ball.r > paddle.x &&
        ball.x - ball.r < paddle.x + paddle.w &&
        ball.y + ball.r > paddle.y &&
        ball.y - ball.r < paddle.y + paddle.h
    );
}


/* =========================
   PARTICLES
========================= */

function createParticles(x, y, amount) {

    for (let i = 0; i < amount; i++) {

        const angle =
            Math.random() * Math.PI * 2;

        const speed =
            1 + Math.random() * 4;

        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            size: 2 + Math.random() * 3
        });
    }
}


function updateParticles() {

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vx *= 0.97;
        p.vy *= 0.97;

        p.life -= 0.025;

        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}


/* =========================
   SOUND
========================= */

function sound(type) {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) return;

        const audio =
            new AudioContext();

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.connect(gain);
        gain.connect(audio.destination);

        if (type === "hit") {
            oscillator.frequency.value = 420;
        } else {
            oscillator.frequency.value = 700;
        }

        oscillator.type = "sine";

        gain.gain.setValueAtTime(
            0.08,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime + 0.08
        );

        oscillator.start();

        oscillator.stop(
            audio.currentTime + 0.08
        );

    } catch(e) {}
}


/* =========================
   SCORE
========================= */

function scorePlayer() {

    playerScore++;

    playerScoreText.textContent =
        playerScore;

    createParticles(
        W / 2,
        H * 0.25,
        30
    );

    sound("score");

    if (playerScore > bestScore) {

        bestScore = playerScore;

        bestText.textContent =
            "BEST: " + bestScore;

        try {
            localStorage.setItem(
                "glowBallBest",
                bestScore
            );
        } catch(e) {}
    }

    if (playerScore >= 7) {
        endGame(true);
        return;
    }

    resetBall("up");
}


function scoreAI() {

    aiScore++;

    aiScoreText.textContent =
        aiScore;

    createParticles(
        W / 2,
        H * 0.75,
        30
    );

    sound("score");

    if (aiScore >= 7) {
        endGame(false);
        return;
    }

    resetBall("down");
}


/* =========================
   GAME END
========================= */

function endGame(playerWon) {

    running = false;
    paused = false;

    winnerText.textContent =
        playerWon ? "YOU WIN!" : "AI WINS!";

    winnerText.style.color =
        playerWon ? "#1687ff" : "#ff3d81";

    finalScoreText.textContent =
        playerScore + " : " + aiScore;

    result.style.display = "flex";
}


/* =========================
   GAME UPDATE
========================= */

function update() {

    if (!running || paused) return;

    ball.x += ball.vx;
    ball.y += ball.vy;

    /* trail */

    trail.push({
        x: ball.x,
        y: ball.y
    });

    if (trail.length > 12) {
        trail.shift();
    }


    /* AI */

    let aiSpeed =
        3.5 + level * 0.42;

    if (mode === "easy")
        aiSpeed *= 0.72;

    if (mode === "hard")
        aiSpeed *= 1.22;

    const aiCenter =
        ai.x + ai.w / 2;

    if (ball.x < aiCenter - 5)
        ai.x += aiSpeed;

    if (ball.x > aiCenter + 5)
        ai.x -= aiSpeed;

    if (ai.x < 10)
        ai.x = 10;

    if (ai.x + ai.w > W - 10)
        ai.x = W - ai.w - 10;


    /* PLAYER PADDLE */

    if (paddleCollision(player, true)) {

        ball.y =
            player.y - ball.r - 1;

        ball.vy =
            -Math.abs(ball.vy);

        const hit =
            (ball.x -
            (player.x + player.w / 2))
            / (player.w / 2);

        ball.vx += hit * 2.2;

        if (Math.abs(ball.vx) > 8)
            ball.vx =
                ball.vx > 0 ? 8 : -8;

        createParticles(
            ball.x,
            ball.y,
            15
        );

        sound("hit");
    }


    /* AI PADDLE */

    if (paddleCollision(ai, false)) {

        ball.y =
            ai.y + ai.h + ball.r + 1;

        ball.vy =
            Math.abs(ball.vy);

        const hit =
            (ball.x -
            (ai.x + ai.w / 2))
            / (ai.w / 2);

        ball.vx += hit * 2.0;

        if (Math.abs(ball.vx) > 8)
            ball.vx =
                ball.vx > 0 ? 8 : -8;

        createParticles(
            ball.x,
            ball.y,
            15
        );

        sound("hit");
    }


    /* SCORE */

    if (ball.y < -ball.r - 10) {
        scorePlayer();
    }

    if (ball.y > H + ball.r + 10) {
        scoreAI();
    }
}


/* =========================
   DRAW
========================= */

function drawRoundedRect(x, y, w, h, r) {

    ctx.beginPath();

    ctx.moveTo(x + r, y);

    ctx.lineTo(x + w - r, y);

    ctx.quadraticCurveTo(
        x + w,
        y,
        x + w,
        y + r
    );

    ctx.lineTo(
        x + w,
        y + h - r
    );

    ctx.quadraticCurveTo(
        x + w,
        y + h,
        x + w - r,
        y + h
    );

    ctx.lineTo(
        x + r,
        y + h
    );

    ctx.quadraticCurveTo(
        x,
        y + h,
        x,
        y + h - r
    );

    ctx.lineTo(
        x,
        y + r
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x + r,
        y
    );

    ctx.closePath();
    ctx.fill();
}


function drawPaddle(paddle, type) {

    ctx.save();

    ctx.shadowBlur = 18;

    if (type === "player") {
        ctx.fillStyle = "#1687ff";
        ctx.shadowColor = "#1687ff";
    } else {
        ctx.fillStyle = "#ff3d81";
        ctx.shadowColor = "#ff3d81";
    }

    drawRoundedRect(
        paddle.x,
        paddle.y,
        paddle.w,
        paddle.h,
        paddle.h / 2
    );

    ctx.restore();
}


function drawBall() {

    /* trail */

    for (let i = 0; i < trail.length; i++) {

        const t = trail[i];

        const alpha =
            i / trail.length * 0.22;

        ctx.beginPath();

        ctx.fillStyle =
            "rgba(108,53,255," + alpha + ")";

        ctx.arc(
            t.x,
            t.y,
            ball.r * (i / trail.length),
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    /* glow */

    ctx.save();

    ctx.shadowBlur = 25;
    ctx.shadowColor = "#6c35ff";

    ctx.beginPath();

    ctx.fillStyle = "#6c35ff";

    ctx.arc(
        ball.x,
        ball.y,
        ball.r,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.restore();
}


function drawParticles() {

    for (const p of particles) {

        ctx.save();

        ctx.globalAlpha =
            Math.max(0, p.life);

        ctx.fillStyle =
            "#6c35ff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }
}


function draw() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );

    ctx.fillStyle = "#ffffff";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* center line */

    ctx.setLineDash([8, 12]);

    ctx.strokeStyle =
        "rgba(0,0,0,0.10)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
        W * 0.12,
        H / 2
    );

    ctx.lineTo(
        W * 0.88,
        H / 2
    );

    ctx.stroke();

    ctx.setLineDash([]);


    drawPaddle(
        ai,
        "ai"
    );

    drawPaddle(
        player,
        "player"
    );

    drawBall();

    drawParticles();
}


/* =========================
   BUTTONS
========================= */

document.getElementById("start")
    .addEventListener("click", startGame);


againButton.addEventListener(
    "click",
    startGame
);


backMenuButton.addEventListener(
    "click",
    () => {

        running = false;
        paused = false;

        result.style.display = "none";
        hud.style.display = "none";
        menu.style.display = "flex";
    }
);


/* =========================
   LOOP
========================= */

function loop() {

    update();

    updateParticles();

    draw();

    requestAnimationFrame(loop);
}


/* =========================
   INIT
========================= */

resize();

resetBall();

loop();

</script>

</body>
    </html>
